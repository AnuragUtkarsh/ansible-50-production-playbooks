---
- name: ansible vault management
  hosts: localhost
  gather_facts: true
  become: yes
  vars_files:
    - vault/vault.yml

  tasks:
    - name: verify database credential are loaded
      ansible.builtin.assert:
        that:
          - db_username | length > 0
          - db_password | length > 0
        fail_msg: "Database Credential missing"
        success_msg: "Database credential configured"
      no_log: true
      tags:
        - vault
        - validate

    - name: Display credential validation status
      ansible.builtin.debug:
        msg: "Database credentials are configured successfully"
      tags:
        - vault
        - validate

