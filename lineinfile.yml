---
- name: ssh config setup
  hosts: app_servers
  gather_facts: yes
  become: yes

  tasks:
    - name: change root login method
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PermitRootLogin"
        line: "PermitRootLogin no"
        validate: "/usr/sbin/sshd -t %s"
      notify: restart sshd
      tags:
        - ssh_config


    - name: change  password method
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
        validate: "/usr/sbin/sshd -t %s"
      notify: restart sshd
      tags:
        - ssh_config

  handlers:
    - name: restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
