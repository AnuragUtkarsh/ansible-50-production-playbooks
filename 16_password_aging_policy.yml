---
- name: set user password policy
  hosts: app_servers
  become: yes
  gather_facts: false

  tasks:
    - name: verify whether user exist or not
      ansible.builtin.getent:
        database: passwd
        key: opsuser
    
    - name: Set maximum expiration date for password
      ansible.builtin.user:
        name: opsuser
        password_expire_max: 90
        password_expire_min: 1
      tags:
        - password_policy

    - name: verify password policy
      ansible.builtin.shell:
        cmd: "chage -l opsuser"
      register: output
      changed_when: false

    - name: print password policy
      ansible.builtin.debug:
        var: output.stdout_lines


 
