---
- name: manage user ssh key
  hosts: app_servers
  become: yes
  gather_facts: true
  vars:
    deploy_ssh_key: "ssh-rsa  root@app02"

  tasks:
    - name: create user
      ansible.builtin.user:
        name: ramu
        state: present
        shell: /bin/bash
        create_home: yes

    - name: create .ssh folder
      ansible.builtin.file:
        path: /home/ramu/.ssh
        state: directory
        owner: ramu
        group: ramu
        mode: '0700'

    - name: add public key
      ansible.posix.authorized_key:
        user: ramu
        state: present
        key: "{{ deploy_ssh_key }}"

    - name: set authorized_keys file permission to 0600
      ansible.builtin.file:
        path: /home/ramu/.ssh/authorized_keys
        state: file
        owner: ramu
        group: ramu
        mode: '0600'

