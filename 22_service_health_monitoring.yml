---
- name: HTTPD Health Verification
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    svc_name: httpd
    svc_port: 80

  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
      register: service_fact
      tags:
        - health
        - validate

    - name: Display current service state
      ansible.builtin.debug:
        msg: "{{ service_fact.ansible_facts.services[svc_name ~ '.service']['state'] | default('not found') }}"
      tags:
        - health
        - validate

    - name: Verify service is running
      ansible.builtin.assert:
        that:
          - >-
            svc_name ~ '.service' in service_fact.ansible_facts.services
            and service_fact.ansible_facts.services[svc_name ~ '.service']['state'] == 'running'
        fail_msg: "{{ svc_name }} service is not running"
        success_msg: "{{ svc_name }} service is running"
      tags:
        - health
        - validate

    - name: Collect listening TCP ports
      ansible.builtin.command:
        cmd: ss -H -lnt
      register: port_check
      changed_when: false
      tags:
        - health
        - validate

    - name: Verify application port is listening
      ansible.builtin.assert:
        that:
          - >-
            port_check.stdout_lines
            | select('search', '(^|\\s)(\\S+:)?' ~ (svc_port | string) ~ '\\s')
            | list | length > 0
        fail_msg: "TCP port {{ svc_port }} is not listening"
        success_msg: "TCP port {{ svc_port }} is listening"
      tags:
        - health
        - validate

    - name: Check HTTP health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ svc_port }}/"
        method: GET
        status_code: 200
        return_content: true
      register: http_check
      changed_when: false
      tags:
        - health
        - validate

    - name: Verify HTTP response
      ansible.builtin.assert:
        that:
          - http_check.status == 200
        fail_msg: "HTTP health check failed"
        success_msg: "HTTP health check passed"
      tags:
        - health
        - validate

    - name: Display health report
      ansible.builtin.debug:
        msg:
          - "Service: {{ svc_name }}"
          - "Service state: {{ service_fact.ansible_facts.services[svc_name ~ '.service']['state'] }}"
          - "TCP port: {{ svc_port }} listening"
          - "HTTP status: {{ http_check.status }}"
      tags:
        - health
        - validate
