---
- name: log rotate configuration
  hosts: localhost
  become: yes
  gather_facts: false
  vars:
    rotation_frequency: daily
    rotation_count: 14
    log_owner: root
    log_group: root
    log_mode: '0640'
    log_file_path: /var/log/myapp/*.log

  tasks:
    - name: generate the log rotate config
      ansible.builtin.template:
        src: templates/myapp.logrotate.j2
        dest: /etc/logrotate.d/myapp
        owner: root
        group: root
        mode: '0644'
      tags:
        - logging

    - name: validate the logrotate
      ansible.builtin.command:
        cmd: logrotate -d /etc/logrotate.d/myapp
      register: logrotate_debug
      changed_when: false
      failed_when: logrotate_debug.rc != 0     
      tags:
        - logrotate
        - logging

