---
- name: create and mount 
  hosts: localhost
  become: yes
  gather_facts: true
  vars:
    dsk: /dev/sdc

  tasks:
    - name: verify the disk
      ansible.builtin.shell:
        cmd: "lsblk {{ dsk }} "
      changed_when: false
      register: output

    - name: validate disk
      ansible.builtin.assert:
        that:
          - output.rc == 0
        fail_msg: disk not exist
        success_msg: disk exist

    - name: create directory
      ansible.builtin.file:
        path: /data
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create filesystem
      community.general.filesystem:
        fstype: xfs
        dev: "{{ dsk }}"


    - name: mount the mount point
      ansible.posix.mount:
        path: /data
        src: "{{ dsk }}"
        fstype: xfs
        state: mounted
      when: output.rc == 0

